[project]
name = "toil_batch_system_tes"
version = "2.0.0"
authors = [
  { name="Adam Novak", email="anovak@soe.ucsc.edu" },
]
description = "A TES batch system plugin for Toil"
readme = "README.md"
requires-python = ">=3.8"
classifiers = [
    "Programming Language :: Python :: 3",
]
dependencies = [
    "toil[aws]>=9.5.0,<10",
    "py-tes>=1.1,<2",
    "pytest>=8.2.2,<10",
    "pytest-cov>=2.12.1,<6",
    "pytest-timeout>=1.4.2,<3",
    "pytest-xdist"
]

[project.urls]
Homepage = "https://github.com/adamnovak/toil_batch_system_tes"
